<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Telegram Battle Map</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;background:#17202a;color:white;margin:0;padding:14px}canvas{width:100%;touch-action:none;background:#e8dfc9;border-radius:12px}button,input,select{padding:10px;border-radius:8px;margin:4px;font-size:16px}#tokenEditor,#masterPanel,#mapPanel,#gridPanel{background:#253444;padding:12px;border-radius:12px;margin-top:8px}#tokenEditor label,#masterPanel label,#mapPanel label{display:block;margin:8px 0}#tokenEditor select,#tokenEditor input{max-width:95%;box-sizing:border-box}#info{padding:12px}</style></head><body><h2>⚔️ Battle Map</h2><div id="info">Demo interattiva: trascina le pedine</div><canvas id="map"></canvas><button id="reset">Ripristina</button><button id="addToken" hidden>➕ Aggiungi pedina</button><button id="joinBattle" hidden>Partecipa</button><button id="assignToken" hidden>Assegna pedina</button><button id="editToken" hidden>✏️ Modifica pedina</button><button id="gridButton" hidden>▦ Dimensione griglia</button><section id="gridPanel" hidden><label>Caselle per lato <input id="gridSize" type="number" min="6" max="40" step="1" value="12"></label><button id="gridSave">💾 Salva griglia</button><button id="gridCancel">Annulla</button></section><button id="chooseMap" hidden>🖼️ Cambia sfondo</button><section id="mapPanel" hidden><label>Sfondo <select id="mapChoice"></select></label><label>Visualizzazione <select id="mapMode"><option value="contain">Adatta (senza tagli)</option><option value="cover">Riempi (ritaglia)</option><option value="manual">Regola manualmente</option></select></label><label>Ingrandimento <input id="mapZoom" type="range" min="50" max="500" value="100"> <span id="mapZoomLabel">100%</span></label><label>Orizzontale <input id="mapX" type="range" min="-200" max="200" value="0"></label><label>Verticale <input id="mapY" type="range" min="-200" max="200" value="0"></label><button id="mapViewSave">💾 Salva regolazione</button><button id="mapSave">Applica sfondo</button><button id="mapCancel">Annulla</button><p>Invia una foto nel gruppo con didascalia /mappa Nome.</p></section><button id="manageMasters" hidden>👑 Gestisci Master</button><section id="masterPanel" hidden><label>Partecipante <select id="masterMember"></select></label><label>Ruolo <select id="masterRole"><option value="player">Giocatore</option><option value="master">Master</option></select></label><button id="masterSave">💾 Salva ruolo</button><button id="masterCancel">Annulla</button></section><section id="tokenEditor" hidden><label>Pedina <select id="tokenChoice"></select></label><label>Icona <input id="tokenEmoji" maxlength="16"></label><label id="tokenNameRow">Nome <input id="tokenName" maxlength="40"></label><label id="tokenSizeRow">Dimensione <select id="tokenSize"><option value="1">1×1</option><option value="2">2×2</option><option value="3">3×3</option><option value="4">4×4</option></select></label><button id="tokenSave">💾 Salva modifiche</button><button id="tokenDelete">🗑️ Elimina pedina</button><button id="tokenCancel">Annulla</button></section><script src="/app.js"></script></body></html>
