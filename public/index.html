<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Telegram Battle Map</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;background:#17202a;color:white;margin:0;padding:14px}canvas{width:100%;touch-action:none;background:#e8dfc9;border-radius:12px}button,input,select{padding:10px;border-radius:8px;margin:4px;font-size:16px}#tokenEditor,#masterPanel,#mapPanel,#gridPanel,#initiativePanel,#areaPanel{background:#253444;padding:12px;border-radius:12px;margin-top:8px}#tokenEditor label,#masterPanel label,#mapPanel label{display:block;margin:8px 0}#tokenEditor select,#tokenEditor input{max-width:95%;box-sizing:border-box}#info{padding:12px}</style><link rel="stylesheet" href="/theme.css?v=1"></head><body><h2>⚔️ Battle Map</h2><section id="myBattles" hidden style="background:#24394c;padding:12px;border:1px solid #52687c;border-radius:12px;margin-bottom:12px"><h3>📚 Le mie battaglie</h3><button id="myBattlesRefresh">🔄 Aggiorna</button><div id="myBattlesList"></div></section><div id="info">Demo interattiva: trascina le pedine</div><canvas id="map"></canvas><button id="reset">Ripristina</button><button id="addToken" hidden>➕ Aggiungi pedina</button><button id="joinBattle" hidden>Partecipa</button><button id="assignToken" hidden>Assegna pedina</button><button id="editToken" hidden>✏️ Modifica pedina</button><button id="conditionsButton" hidden>🩹 Stati pedine</button><section id="conditionsPanel" hidden><select id="conditionsToken"></select><label>Ferite <input id="conditionsWounds" type="number" min="0" max="10" value="0"></label><label><input id="conditionsShaken" type="checkbox"> Scosso</label><label><input id="conditionsDistracted" type="checkbox"> Distratto</label><label><input id="conditionsVulnerable" type="checkbox"> Vulnerabile</label><button id="conditionsSave">Salva stati</button><button id="conditionsClose">Chiudi</button></section><button id="measureButton">📏 Misura distanza</button><button id="measureClear" hidden>✖ Chiudi righello</button><span id="measureResult" role="status"></span><button id="areaButton">🔥 Aree d'effetto</button><section id="areaPanel" hidden><label>Sagoma <select id="areaShape"><option value="small">Esplosione piccola (diametro 2″)</option><option value="medium">Esplosione media (diametro 4″)</option><option value="large">Esplosione grande (diametro 6″)</option><option value="cone">Cono (lunghezza 9″)</option><option value="line">Linea (lunghezza 12″)</option></select></label><p id="areaHelp">Tocca la mappa per posizionare la sagoma.</p><button id="areaShare">📤 Invia sagoma</button><div id="areaRequests"></div><button id="areaClear">🧹 Cancella sagoma</button><button id="areaClose">✖ Chiudi</button></section><button id="initiativeButton" hidden>🃏 Iniziativa</button><section id="initiativePanel" hidden><div id="initiativeStatus">Nessun combattimento attivo</div><div id="initiativeList"></div><div id="initiativeMaster" hidden><p>Seleziona le pedine che partecipano:</p><div id="initiativeChoices"></div><div id="initiativeRequests"></div><button id="initiativeReveal">👁️ Rivela prossima carta</button><button id="initiativeStart">🃏 Distribuisci carte</button><button id="initiativeNext">➡️ Prossimo turno</button><button id="initiativeRound">🔄 Nuovo round</button><button id="initiativeReset">⏹️ Termina combattimento</button></div><div id="initiativeRedraw"></div><button id="initiativeClose">Chiudi</button></section><button id="gridButton" hidden>▦ Dimensione griglia</button><section id="gridPanel" hidden><label>Caselle per lato <input id="gridSize" type="number" min="6" max="40" step="1" value="12"></label><button id="gridSave">💾 Salva griglia</button><button id="gridCancel">Annulla</button></section><button id="chooseMap" hidden>🖼️ Cambia sfondo</button><section id="mapPanel" hidden><label>Sfondo <select id="mapChoice"></select></label><label>Visualizzazione <select id="mapMode"><option value="contain">Adatta (senza tagli)</option><option value="cover">Riempi (ritaglia)</option><option value="manual">Regola manualmente</option></select></label><label>Ingrandimento <input id="mapZoom" type="range" min="50" max="500" value="100"> <span id="mapZoomLabel">100%</span></label><label>Orizzontale <input id="mapX" type="range" min="-200" max="200" value="0"></label><label>Verticale <input id="mapY" type="range" min="-200" max="200" value="0"></label><button id="mapViewSave">💾 Salva regolazione</button><button id="mapSave">Applica sfondo</button><button id="mapCancel">Annulla</button><p>Invia una foto nel gruppo con didascalia /mappa Nome.</p></section><button id="manageMasters" hidden>👑 Gestisci Master</button><section id="masterPanel" hidden><label>Partecipante <select id="masterMember"></select></label><label>Ruolo <select id="masterRole"><option value="player">Giocatore</option><option value="master">Master</option></select></label><button id="masterSave">💾 Salva ruolo</button><button id="masterCancel">Annulla</button></section><section id="tokenEditor" hidden><label>Pedina <select id="tokenChoice"></select></label><label>Icona <input id="tokenEmoji" maxlength="16"></label><label id="tokenNameRow">Nome <input id="tokenName" maxlength="40"></label><label id="tokenSizeRow">Dimensione <select id="tokenSize"><option value="1">1×1</option><option value="2">2×2</option><option value="3">3×3</option><option value="4">4×4</option></select></label><button id="tokenSave">💾 Salva modifiche</button><button id="tokenDelete">🗑️ Elimina pedina</button><button id="tokenCancel">Annulla</button></section><script src="/deeplink.js?v=2"></script><script src="/app.js"></script><script src="/status.js"></script><script src="/measure.js"></script><script src="/areas.js?v=3"></script><script src="/my-battles.js?v=6"></script></body></html>
