<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Telegram Battle Map</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;background:#17202a;color:white;margin:0;padding:14px}canvas{width:100%;touch-action:none;background:#e8dfc9;border-radius:12px}button,input,select{padding:10px;border-radius:8px;margin:4px;font-size:16px}#tokenEditor{background:#253444;padding:12px;border-radius:12px;margin-top:8px}#tokenEditor label{display:block;margin:8px 0}#tokenEditor select,#tokenEditor input{max-width:95%;box-sizing:border-box}#info{padding:12px}</style></head><body><h2>⚔️ Battle Map</h2><div id="info">Demo interattiva: trascina le pedine</div><canvas id="map"></canvas><button id="reset">Ripristina</button><button id="addToken" hidden>➕ Aggiungi pedina</button><button id="joinBattle" hidden>Partecipa</button><button id="assignToken" hidden>Assegna pedina</button><button id="editToken" hidden>✏️ Modifica pedina</button><section id="tokenEditor" hidden><label>Pedina <select id="tokenChoice"></select></label><label>Operazione <select id="tokenAction"><option value="emoji">Cambia icona</option><option value="name">Cambia nome</option><option value="size">Dimensione</option><option value="delete">Elimina pedina</option></select></label><label id="tokenTextRow">Nuovo valore <input id="tokenText" maxlength="40"></label><label id="tokenSizeRow" hidden>Dimensione <select id="tokenSize"><option value="1">1×1</option><option value="2">2×2</option><option value="3">3×3</option><option value="4">4×4</option></select></label><button id="tokenSave">Salva</button><button id="tokenCancel">Annulla</button></section><script src="/app.js"></script></body></html>
